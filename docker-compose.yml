name: laravel-task-management

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-task-management
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-task_management}
      - DB_USERNAME=${DB_USERNAME:-task_user}
      - DB_PASSWORD=${DB_PASSWORD:-task_password}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-task_management}
      - MYSQL_USER=${DB_USERNAME:-task_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-task_password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: laravel-task-management
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=1 --tries=3
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: laravel-task-management
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
